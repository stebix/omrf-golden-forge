[project]
name = "omrf-mlab-golden-workspace"
version = "0.0.0"
description = "uv workspace root for omrf-mlab-golden packages"
requires-python = ">=3.12"
dependencies = [
    "omrf-mlab-golden-forge",
    "omrf-mlab-golden-schema",
]

[dependency-groups]
dev = ["ruff", "pyright", "pytest"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
omrf-mlab-golden-forge = { workspace = true }
omrf-mlab-golden-schema = { workspace = true }

[tool.ruff]
line-length = 89
exclude = ["vendor"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "Q",
    "RUF",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
force-single-line = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = ["vendor", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
