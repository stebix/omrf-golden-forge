[project]
name = "omrf-mlab-golden-forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stebix", email = "jannik.stebani@physik.uni-wuerzburg.de" }
]
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.1",
    "rich>=13.0",
]

[project.scripts]
omrf-mlab-golden-forge = "omrf_mlab_golden_forge:main"

[dependency-groups]
dev = ["ruff", "pyright"]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 89
exclude = ["vendor"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "Q",
    "RUF",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
force-single-line = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
exclude = ["vendor", ".venv"]
